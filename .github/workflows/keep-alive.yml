# Supabase pauses a free project after a week with too little database use, and
# visitors never reach the database (the site is static). The Monday deploy alone
# is about 7 days apart, so read one row a day to keep the project awake.
# A failed run (e.g. the project already paused) shows up as a failed workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *" # daily, 10:17 Bangkok time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # the public mirror gets this file but not the secrets
    if: github.repository == 'rockhome192/review-manga'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one title
        run: |
          curl -sSf --retry 3 --retry-delay 10 -o /dev/null \
            -H "apikey: $KEY" "$URL/rest/v1/titles?select=anilist_id&limit=1"
          echo "Supabase answered"
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
