# Build the static site from Supabase and deploy it to Cloudflare Workers.
# Runs on Linux because OpenNext doesn't guarantee Windows builds.
# Data edits in Supabase don't touch the repo: run this by hand (Actions → Deploy → Run workflow)
# to publish them, until the pipeline triggers it.
# The Monday run picks the week's featured titles and the "trending" list, then rebuilds.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  schedule:
    - cron: "5 17 * * 0" # Monday 00:05 Bangkok time
    - cron: "5 23 * * 0" # Monday 06:05: retry, in case AniList was down at midnight

# a newer deploy replaces one still running
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Weekly featured + "trending" list from AniList trending. Skipped on pushes, so a
      # code deploy never reshuffles the week; a week already picked is left alone.
      # On failure the site keeps last week's picks. Only this step sees the DB secret,
      # which is the restricted weekly_bot role (supabase/migrations/0004_weekly_bot.sql).
      - name: Install pipeline deps
        if: github.event_name != 'push'
        working-directory: .
        run: npm ci
      - name: Pick this week's trending titles
        if: github.event_name != 'push'
        continue-on-error: true
        working-directory: .
        # DB errors can echo the user and password (e.g. a password pasted into the
        # user slot); mask both so a malformed secret never shows in the log
        run: |
          node -e '
            try {
              const u = new URL(process.env.SUPABASE_DB_URL);
              for (const v of [u.username, u.password, decodeURIComponent(u.password)])
                if (v) console.log(`::add-mask::${v}`);
            } catch {}'
          npx tsx pipeline/weekly-trending.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.WEEKLY_BOT_DB_URL }}
      - run: npm ci
      - run: npm run lint
      - name: Build and deploy
        run: npm run deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # repo variable (Settings → Secrets and variables → Actions → Variables);
          # left unset, robots.txt blocks crawlers
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The live site answers: home, the sitemap, the first title page in it, and the
      # security headers from next.config.ts. Retries for a few seconds while the new
      # version spreads.
      - name: Smoke test
        if: vars.SITE_URL != ''
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          SITE="${SITE%/}"
          check() { for i in 1 2 3 4 5; do curl -sfo /dev/null "$1" && return 0; sleep 5; done; echo "::error::$1 did not answer"; return 1; }
          check "$SITE/"
          check "$SITE/sitemap.xml"
          page=$(curl -sf "$SITE/sitemap.xml" | grep -m1 -oE "$SITE/(manga|manhwa)/[^<]+")
          check "$page"
          curl -sI "$page" | grep -qi '^x-content-type-options: nosniff' || { echo "::error::security headers missing on $page"; exit 1; }
          echo "ok: $page"
